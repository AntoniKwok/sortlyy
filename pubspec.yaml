name: sortly
description: "Tinder for your camera roll — swipe to delete, keep, or favorite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Backend / Auth
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # HTTP Client
  dio: ^5.7.0

  # Functional Programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^8.0.2

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.3.3

  # Gallery / Photos
  photo_manager: ^3.3.0
  permission_handler: ^11.3.1

  # UI
  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.2.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  font_awesome_flutter: ^10.7.0
  purchases_flutter: ^9.14.0
  purchases_ui_flutter: ^9.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
